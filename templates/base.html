<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FF14 Gather List Builder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <script>
    window.MESSAGES = {{ ui_messages | tojson }};
    window.BACKGROUNDS = {{ backgrounds | tojson }};
    window.msg = function (code, fallback) { return window.MESSAGES[code] || fallback; };
  </script>
  <script src="{{ url_for('static', filename='background.js') }}"></script>
</head>
<body>
  <header>
    <h1>Gather List Builder</h1>
    <div class="top-left">
      <div class="corner-row">
        <select id="alarm-toggle">
          <option value="off">{{ t("alarm_off") }}</option>
          <option value="on">{{ t("alarm_on") }}</option>
        </select>
        <select id="alarm-sound">
          {% for sound in alarm_sounds %}
          <option value="{{ sound }}" {% if sound == "chime.wav" %}selected{% endif %}>{{ sound.rsplit(".", 1)[0] }}</option>
          {% endfor %}
        </select>
        <button type="button" id="alarm-test" class="secondary" title="{{ t('alarm_test_title') }}">{{ t("alarm_test") }}</button>
      </div>
      <div class="corner-row">
        <label class="switch">
          <input type="checkbox" id="prealarm-toggle">
          {{ t("prealarm") }}
        </label>
        <input type="number" id="prealarm-minutes" min="1" max="60" value="5" title="{{ t('prealarm_minutes') }}">
        <select id="prealarm-sound">
          {% for sound in alarm_sounds %}
          <option value="{{ sound }}" {% if sound == "classic-beep.wav" %}selected{% endif %}>{{ sound.rsplit(".", 1)[0] }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="top-right">
      <form method="post" action="/language">
        <input type="hidden" name="list" value="{{ selected }}">
        <select name="language">
          {% for lang in languages %}
          <option value="{{ lang }}" {% if lang == language %}selected{% endif %}>{{ lang | upper }}</option>
          {% endfor %}
        </select>
        <button type="submit" class="secondary">{{ t("language_set") }}</button>
      </form>
      <div class="switch-stack">
        <form method="post" action="/clear-cache" onsubmit="return confirm('{{ t('clear_caches_confirm') }}')">
          <input type="hidden" name="list" value="{{ selected }}">
          <button type="submit" class="danger">{{ t("clear_caches") }}</button>
        </form>
        <form method="post" action="/refetch-list">
          <input type="hidden" name="list" value="{{ selected }}">
          <button type="submit" class="secondary" {% if not selected %}disabled{% endif %}>{{ t("refetch_list") }}</button>
        </form>
      </div>
    </div>
  </header>

  <div class="page">
  <nav class="tabs">
    <a href="/?list={{ selected }}" class="tab {% if active_tab == 'lists' %}active{% endif %}">{{ t("tab_lists") }}</a>
    <a href="/collectables?list={{ selected }}" class="tab {% if active_tab == 'collectables' %}active{% endif %}">{{ t("tab_collectables") }}</a>
    <a href="/craftables?list={{ selected }}" class="tab {% if active_tab == 'craftables' %}active{% endif %}">{{ t("tab_craftables") }}</a>
    <a href="/quick-buck?list={{ selected }}" class="tab {% if active_tab == 'quickbuck' %}active{% endif %}">{{ t("tab_quickbuck") }}</a>
  </nav>

  <main>
    {% if api_failed %}
    <div class="banner">{{ t("api_banner") }}</div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
  </div>

  <div id="toast" class="toast"></div>

  <div class="import-corner">
    <div id="import-panel" class="import-panel" hidden>
      <form method="post" action="/import" enctype="multipart/form-data">
        <input type="file" name="file" accept=".json,application/json" required class="file-input">
        <button type="submit" class="secondary">{{ t("import") }}</button>
        <button type="button" id="import-close" class="danger">{{ t("modal_close") }}</button>
      </form>
    </div>
    <button type="button" id="import-open" class="secondary">{{ t("import") }}</button>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <p id="modal-body"></p>
      <button type="button" id="modal-close" class="secondary">{{ t("modal_close") }}</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='suggest.js') }}"></script>
  <script src="{{ url_for('static', filename='copy.js') }}"></script>
  <script src="{{ url_for('static', filename='fetch-toast.js') }}"></script>
  <script src="{{ url_for('static', filename='ajax-add.js') }}"></script>
  <script src="{{ url_for('static', filename='timer.js') }}"></script>
  <script src="{{ url_for('static', filename='filters.js') }}"></script>
  <script src="{{ url_for('static', filename='import.js') }}"></script>
  <script src="{{ url_for('static', filename='sticky.js') }}"></script>
  <script src="{{ url_for('static', filename='alarm-marks.js') }}"></script>
  <script src="{{ url_for('static', filename='modal-pin.js') }}"></script>
  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='pending.js') }}"></script>
</body>
</html>
